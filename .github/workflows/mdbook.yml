# Sample workflow for building and deploying a mdBook site to GitHub Pages

name: Deploy mdBook site to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - './editor-commands.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions'
    runs-on: ubuntu-latest
    #env:
    #  MDBOOK_VERSION: 0.4.51
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      #- name: Install Rust
      #  uses: actions-rs/toolchain@v1
      #  with:
      #    toolchain: stable
      #    override: true

      #- name: Set up Cargo environment
      #  run: source "$HOME/.cargo/env"

      #     # Установка дополнительных препроцессоров
      #     cargo install mdbook-admonish@1.18.0
      #     cargo install mdbook-embedify@0.2.11
      #     cargo install mdbook-mermaid@0.14.1
      #     cargo install mdbook-numeq@0.4.0
      #     cargo install mdbook-katex@0.9.2

      - name: Make binaries executable
        run: |
          chmod +x ./bin/mdbook
          chmod +x ./bin/editor-md
          chmod +x ./copy_raw_other_files.sh
          chmod +x ./execute_editor_commands.sh

      - name: Execute editor-md commands
        run: ./execute_editor_commands.sh

      - name: Commit changes made by editor-md if any
        if: ${{ hashFiles('./editor-commands.json') != '' }}
        run: |
          git config user.name "CI Bot"
          git config user.email "ci-bot@example.com"

          # Проверка на наличие изменений
          if [[ -n $(git status --porcelain) ]]; then
            echo "Есть изменения после editor-md. Добавляю их в коммит."

            # НЕ добавляем сам ./editor-commands.json, чтобы он не запускался снова
            git add .
            echo '{}' > ./editor-commands.json
            git reset ./editor-commands.json || true

            # Удаляем editor-commands.json 
            rm -f ./editor-commands.json

            git commit -m "Apply editor-md changes from CI [skip ci]"
            git push # git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Jekahome/snippet-stash.git HEAD:main
          else
            echo "Нет изменений. Коммит не требуется."
            # Удаляем editor-commands.json 
            rm -f ./editor-commands.json
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with mdBook
        run: |
          ./bin/mdbook build
          ./copy_raw_other_files.sh
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

      #- name: Install Netlify CLI
      #  run: npm install netlify-cli -g

      #- name: Deploy to Netlify
      #  run: netlify deploy --prod --dir=book --site=$NETLIFY_SITE_ID
      #  env:
      #    NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      #    NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}    

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4